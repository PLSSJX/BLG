<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Makise Toolkit · 项目</title>
<link rel="stylesheet" href="css/style.css?v=7">
<style>
  /* 内嵌到 MT 主界面时，隐藏原型自己的左侧栏（MT 已经有导航栏了） */
  body.embed-mode .rail { display: none; }
  body.embed-mode .shell { height: 100%; }
  /* 内嵌时不要透明：透明会让外层底色透上来，文字发灰看不清 */
  body.embed-mode .slab { border-radius: 0; }
  body.embed-mode .view { padding: 18px 22px 24px; }
  body.embed-mode { background: var(--md-surface); }
  /* 内嵌时必须把高度撑满 iframe，否则底下会露出外层的灰带 */
  html:has(body.embed-mode),
  body.embed-mode,
  body.embed-mode .shell { height: 100%; margin: 0; }
  body.embed-mode .slab { min-height: 100%; }
</style>
<script>
  // 在 MT 里是嵌在 iframe 中的：点进项目后 URL 不再带 ?embed=1，
  // 所以用 window.top !== window.self 判断，别再依赖查询参数。
  if (location.search.indexOf('embed=1') >= 0 || window.top !== window.self) {
    document.documentElement.dataset.embed = '1';
  }
</script>
</head>
<body>

<div class="shell">
  <nav class="rail">
    <button class="rail-fab" id="newProject" title="新建项目">+</button>
    <div class="rail-spacer"></div>
  </nav>
  <main class="slab">
    <div class="view">
      <h1 class="page-title">项目</h1>
      <p class="page-sub">每个项目是一个被接管的文件夹，每次保存都会留一个版本，随时能回去。</p>
      <div id="list"></div>
    </div>
  </main>
</div>

<div class="dialog-host" id="dialogHost">
  <div class="dialog">
    <h3>新建项目</h3>
    <p>选一个空文件夹，Makise Toolkit 会接管它，之后每次保存都记一个版本。</p>
    <input class="input" id="projectName" placeholder="项目名称，例如：低功耗芯片论文">
    <input class="input" id="projectPath" placeholder="文件夹路径，例如：D:\\我的项目\\低功耗芯片" style="margin-top:8px">
    <div class="actions">
      <button class="btn text" id="cancel">取消</button>
      <button class="btn" id="confirm">创建</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=7"></script>
<style>
/* 没有项目时的引导：暗色、箭头指向左上角 */
.empty-hint {
  position: absolute; left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  display: flex; align-items: flex-start; gap: 18px;
  color: #5f7d75;
}
.empty-arrow { font-size: 54px; line-height: 1; transform: rotate(-38deg); opacity: .55; }
.empty-text { font-size: 15px; line-height: 1.9; letter-spacing: .4px; }
.empty-text b { display: block; font-size: 17px; color: #7fa69c; margin-bottom: 6px; font-weight: 600; }
</style>
<div class="empty-hint" id="emptyHint" style="display:none">
  <div class="empty-arrow">↖</div>
  <div class="empty-text"><b>创建第一个项目吧！</b>点左上角的 ＋ 选一个空文件夹开始</div>
</div>
<script>
  // 和 MT 主界面的约定：告诉它当前是哪一屏，外部据此切换左上角按钮
  window.tellHost = function (extra) {
    try { parent.postMessage(Object.assign({ type: 'mt-state', view: 'list' }, extra || {}), location.origin); } catch (e) {}
  };
  window.addEventListener('load', () => { tellHost(); });
  window.addEventListener('message', (e) => {
    if (!e || !e.data) return;
    if (e.data.type === 'mt-new') {
      const dlg = document.getElementById('dialogHost');
      if (dlg) dlg.classList.add('open');
      const name = document.getElementById('projectName');
      if (name) setTimeout(() => name.focus(), 60);
    }
  });
</script>
<script src="js/api.js?v=7"></script>
<script>
const MTD = window.MTData;

const list = document.getElementById('list');
const host = document.getElementById('dialogHost');

let MTOnline = false;

async function render() {
  let projects = [];
  MTOnline = await MTApi.available().catch(() => false);
  if (MTOnline) {
    try { projects = (await MTApi.list()).projects || []; } catch (e) { projects = []; }
  } else {
    projects = MTD.loadProjects();
  }
  list.innerHTML = '';
  const hint = document.getElementById('emptyHint');
  if (hint) hint.style.display = projects.length ? 'none' : 'flex';
  if (window.tellHost) window.tellHost({ count: projects.length });
  if (!projects.length) return;
  const grid = document.createElement('div');
  grid.className = 'projects';
  projects.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.style.animationDelay = (i * 40) + 'ms';
    card.innerHTML =
      '<div class="project-name">' + p.name + '</div>' +
      '<div class="project-path">' + p.path + '</div>' +
      '<div class="project-actions">' +
        '<button class="mini-btn" data-act="rename" title="改个项目名">重命名</button>' +
        '<button class="mini-btn danger" data-act="delete" title="删掉项目和它的文件夹">删除项目</button>' +
      '</div>' +
      '<div class="project-meta">' +
        '<span>版本 <b>' + (p.commits || 0) + '</b></span>' +
        (p.branch ? '<span>分支 <b>' + p.branch + '</b></span>' : '') +
        (p.head ? '<span>' + String(p.head).slice(0, 7) + '</span>' : '') +
      '</div>';
    card.onclick = (ev) => {
      const act = ev.target && ev.target.dataset ? ev.target.dataset.act : '';
      if (act) { ev.stopPropagation(); onCardAction(p, act); return; }
      location.href = 'project.html?id=' + encodeURIComponent(p.id) + '&embed=1';
    };
    grid.append(card);
  });
  list.append(grid);
}

document.getElementById('newProject').onclick = () => {
  document.getElementById('projectName').value = '';
  document.getElementById('projectPath').value = '';
  host.classList.add('open');
  setTimeout(() => document.getElementById('projectName').focus(), 80);
};
document.getElementById('cancel').onclick = () => host.classList.remove('open');
host.onclick = (e) => { if (e.target === host) host.classList.remove('open'); };
document.getElementById('confirm').onclick = async () => {
  const name = document.getElementById('projectName').value.trim();
  const path = document.getElementById('projectPath').value.trim();
  if (!name || !path) { alert('名称和路径都要填'); return; }
  try {
    const p = MTOnline ? await MTApi.create(name, path) : MTD.createProject(name, path);
    host.classList.remove('open');
    await render();
    if (p && p.id) location.href = 'project.html?id=' + encodeURIComponent(p.id) + '&embed=1';
  } catch (e) {
    alert('创建失败：' + e.message);
  }
};

/** 卡片上的三个动作：重命名 / 删除项目 */
/** 应用内对话框：不用原生 confirm/prompt（会被"阻止此页面创建更多对话框"静默拦掉） */
function askDialog(opts) {
  return new Promise((resolve) => {
    const host = document.createElement('div');
    host.className = 'mt-modal';
    host.innerHTML = '<div class="mt-modal-box"><div class="mt-modal-title"></div>' +
      '<div class="mt-modal-body"></div>' +
      '<input class="input mt-modal-input" style="display:none">' +
      '<div class="mt-modal-row"><button class="btn text" data-act="cancel"></button>' +
      '<button class="btn" data-act="ok"></button></div></div>';
    host.querySelector('.mt-modal-title').textContent = opts.title || '提示';
    host.querySelector('.mt-modal-body').textContent = opts.body || '';
    host.querySelector('[data-act="ok"]').textContent = opts.okText || '确定';
    host.querySelector('[data-act="cancel"]').textContent = opts.cancelText || '取消';
    if (opts.danger) host.querySelector('[data-act="ok"]').style.background = '#ffb4ab';
    const input = host.querySelector('.mt-modal-input');
    if (opts.input !== undefined) {
      input.style.display = 'block';
      input.value = opts.input;
      host.querySelector('.mt-modal-body').style.display = 'none';
    }
    document.body.append(host);
    const close = (v) => { host.remove(); resolve(v); };
    host.querySelector('[data-act="ok"]').onclick = () => close(opts.input !== undefined ? input.value : true);
    host.querySelector('[data-act="cancel"]').onclick = () => close(opts.input !== undefined ? null : false);
    host.onclick = (e) => { if (e.target === host) close(opts.input !== undefined ? null : false); };
    setTimeout(() => (opts.input !== undefined ? input : host.querySelector('[data-act="ok"]')).focus(), 40);
  });
}

/** 卡片上的动作：重命名 / 删除项目 */
async function onCardAction(p, act) {
  if (act === 'rename') {
    const name = await askDialog({ title: '重命名项目', input: p.name, okText: '改名' });
    if (!name || !name.trim() || name === p.name) return;
    try { await MTApi.rename(p.id, name.trim()); await render(); }
    catch (e) { await askDialog({ title: '改名失败', body: e.message, okText: '知道了', cancelText: '关闭' }); }
    return;
  }
  if (act === 'delete') {
    const ok = await askDialog({
      title: '删除项目',
      body: '删除「' + p.name + '」？\n\n确定 = 连文件夹一起删掉（不可恢复）\n取消 = 什么都不做',
      okText: '删除', danger: true,
    });
    if (!ok) return;
    try {
      await MTApi.deleteProject(p.id, true);
      await render();
    } catch (e) {
      const only = await askDialog({
        title: '文件夹删不掉',
        body: '可能里面还有文件开着：' + e.message + '\n\n只从列表移除这个项目？（文件保留）',
        okText: '只移除', cancelText: '算了',
      });
      if (only) {
        try { await MTApi.deleteProject(p.id, false); await render(); }
        catch (e2) { await askDialog({ title: '移除失败', body: e2.message, okText: '知道了', cancelText: '关闭' }); }
      }
    }
  }
}

render();
</script>
<script>
  if (document.documentElement.dataset.embed === '1') document.body.classList.add('embed-mode');
</script>
</body>
</html>
