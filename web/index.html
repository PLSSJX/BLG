<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>哔哩采集器 · BiliGrab</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234CAF50' d='M18 4v1h-2V4c0-.55-.45-1-1-1H9c-.55 0-1 .45-1 1v1H6V4c0-.55-.45-1-1-1s-1 .45-1 1v1c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-1V4c0-.55-.45-1-1-1s-1 .45-1 1zm-8 5.5 6 3.5-6 3.5z'/></svg>">
</head>
<body class="mode-dark">
  <!-- 左侧导航栏：对应 Kazumi 的 NavigationRail（leading 是搜索 FAB，导航项贴底） -->
  <aside class="rail" id="rail">
    <button class="rail-fab" id="railSearch" title="快速解析" aria-label="快速解析"></button>
    <nav class="rail-destinations" id="railDestinations"></nav>
  </aside>

  <!-- 内容区：Kazumi 里那块 primaryContainer 圆角色板 -->
  <main class="slab" id="slab">
    <div class="view" id="view"></div>
  </main>

  <!-- 窄屏底部导航，对应 Kazumi 竖屏下的 NavigationBar -->
  <nav class="bottom-bar" id="bottomBar"></nav>

  <div class="toast-host" id="toastHost"></div>
  <div class="dialog-host" id="dialogHost"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
